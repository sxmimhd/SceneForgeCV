
project:
  name: SceneForgeCV
  seed: 42

dataset:
  root: data-source/minecraft_mobs_yolo
  processed_root: data/processed
  classes:
    - creeper
    - skeleton
    - spider
    - zombie
    - enderman
  num_classes: 5

classification:
  image_size: 224
  batch_size: 32
  epochs: 8
